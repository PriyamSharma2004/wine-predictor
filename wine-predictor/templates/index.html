 <!DOCTYPE html>
<html>
<head>
    <title>Wine Quality Predictor</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 0 auto; padding: 20px; }
        .slider { width: 100%; margin: 10px 0; }
        .result { padding: 15px; margin-top: 20px; border-radius: 5px; }
        .good { background: #d4edda; color: #155724; }
        .bad { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🍷 Wine Quality Predictor</h1>
    
    <form id="predictionForm">
        <div>
            <label>Alcohol (%):</label>
            <input type="range" name="alcohol" min="8" max="15" step="0.1" value="10.5" 
                   oninput="this.nextElementSibling.value = this.value">
            <output>10.5</output>
        </div>
        
        <button type="submit">Predict Quality</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const response = await fetch('/predict', {
                method: 'POST',
                body: new URLSearchParams(formData)
            });
            
            const data = await response.json();
            const resultDiv = document.getElementById('result');
            
            if (data.error) {
                resultDiv.className = 'result';
                resultDiv.innerHTML = `Error: ${data.error}`;
            } else {
                resultDiv.className = `result ${data.prediction.toLowerCase()}`;
                resultDiv.innerHTML = `
                    Prediction: <strong>${data.prediction}</strong><br>
                    Confidence: ${data.confidence}
                `;
            }
        });
    </script>
</body>
</html>
